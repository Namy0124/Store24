<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>總公司後台</title>
<style>
[hidden] { display: none !important; }

:root {
  /* Layout concept: full-bleed 3D store; HUD chips hug the top edge, product windows rise as sheets from the bottom. */
  --bg: #E1EBE9;
  --fg: #17262B;
  --muted: #566B70;
  --panel: #FFFFFF;
  --panel-soft: #EDF3F2;
  --line: #CBD8D6;
  --accent: #0B7A82;
  --accent-ink: #FFFFFF;
  --signal: #F2B200;
  --danger: #C2362B;
  --scrim: rgba(8, 24, 28, 0.48);
  --shadow: 0 10px 30px rgba(10, 40, 45, 0.20);
  --font-display: 'Huninn', 'Noto Sans TC', system-ui, sans-serif;
  --font-body: 'Noto Sans TC', system-ui, -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1719; --fg: #E4EFEE; --muted: #93A9AD; --panel: #172326; --panel-soft: #1E2E32;
    --line: #2C4146; --accent: #3FC2CC; --accent-ink: #06282B; --signal: #F5C531; --danger: #F0766B;
    --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1719; --fg: #E4EFEE; --muted: #93A9AD; --panel: #172326; --panel-soft: #1E2E32;
  --line: #2C4146; --accent: #3FC2CC; --accent-ink: #06282B; --signal: #F5C531; --danger: #F0766B;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* buttons */
button, .btn, [data-co] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }   /* no double-tap-zoom delay on taps */
.btn { border: 1.5px solid var(--line); background: var(--panel); border-radius: 999px; padding: 9px 18px; font-weight: 500; min-height: 40px; }
.btn:hover { border-color: var(--accent); }
.btn.signal { background: var(--signal); color: #1a1a1a; border-color: var(--signal); font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.pub { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; margin-bottom: 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--panel); }
.pub.dirty { border-color: var(--accent); }
.pubtxt { flex: 1 1 200px; font-size: 13px; color: var(--muted); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 5px 12px; min-height: 32px; font-size: 13px; }
.btn.danger.armed { background: var(--danger); color: #fff; }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.hud-top { position: absolute; top: 12px; left: 0; right: 0; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.chip { pointer-events: auto; background: var(--panel); border-radius: 999px; padding: 7px 16px; font-family: var(--font-display); font-size: 16px; box-shadow: var(--shadow); max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hud-top .btn { pointer-events: auto; box-shadow: var(--shadow); }
.greet { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.greet-menu { display: flex; flex-direction: column; gap: 6px; }
.greet .btn { box-shadow: var(--shadow); }
.music { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(440px, calc(100% - 24px)); max-height: 78%; overflow-y: auto; z-index: 30; background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.music.closed { transform: translate(-50%, 140%); visibility: hidden; transition: transform .2s, visibility 0s .2s; }
.m-head { display: flex; align-items: center; gap: 10px; } .m-head b { flex: none; } .m-now { flex: 1; min-width: 0; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-add { display: flex; gap: 8px; } .m-add input { flex: 1; min-width: 0; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--panel-soft); }
.m-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; } .m-row.on { font-weight: 700; }
.m-tag { flex: none; font-size: 11.5px; background: var(--panel-soft); border-radius: 999px; padding: 2px 8px; } .m-url { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-res { display: flex; align-items: center; gap: 8px; padding: 4px 0; } .m-res img { width: 40px; height: 40px; border-radius: 8px; flex: none; background: var(--panel-soft); }
.m-res .m-tt { flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; } .m-res .m-tt span { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-empty, .m-note { font-size: 12.5px; color: var(--muted); margin: 0; } .m-btns { display: flex; gap: 8px; }
.hud-bottom { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.interact { pointer-events: auto; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 12px 26px; font-weight: 700; font-size: 16px; box-shadow: var(--shadow); }
.greet .btn.pulse { animation: gpulse 1s ease-in-out infinite; border-color: #F2B200; background: #FFF4CC; }
@keyframes gpulse { 50% { transform: scale(1.12); } }
.phone { position: absolute; left: 50%; bottom: 0; width: min(290px, 74vw); z-index: 26; pointer-events: auto; transform: translate(-50%, 115%); transition: transform .5s cubic-bezier(.2, .8, .2, 1); }
.phone.up { transform: translate(-50%, -6px); }
.ph-body { position: relative; background: #11181B; border-radius: 34px 34px 0 0; padding: 12px 10px 0; box-shadow: 0 -6px 30px rgba(0, 0, 0, .45); transform: perspective(900px) rotateX(9deg); transform-origin: 50% 100%; }
.ph-screen { position: relative; background: #1B2A30; border-radius: 24px 24px 0 0; overflow: hidden; height: min(520px, 68vh); display: flex; flex-direction: column; color: #fff; }
.ph-status { display: flex; justify-content: space-between; font-size: 12px; padding: 8px 14px 0; opacity: .9; }
.ph-home { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 28px 14px; background: linear-gradient(160deg, #0B7A82, #23405A); }
.ph-clock { font-size: 54px; font-weight: 700; margin-bottom: 18px; font-variant-numeric: tabular-nums; }
.ph-apps { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.ph-app { background: transparent; border: 0; color: #fff; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; }
.ph-app span { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 15px; background: rgba(255, 255, 255, .2); font-size: 28px; }
.ph-app.off { opacity: .45; }
.ph-best { margin-top: auto; font-size: 13px; opacity: .85; }
.ph-game { position: relative; flex: 1; min-height: 0; background: #F3E8D2; display: flex; }
.ph-game canvas { width: 100%; height: 100%; display: block; touch-action: none; }
.ph-score { position: absolute; top: 8px; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 700; color: #5B4A2C; pointer-events: none; }
.ph-over { position: absolute; inset: 0; background: rgba(20, 20, 20, .6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 18px; pointer-events: none; text-align: center; }
.ph-call { position: absolute; inset: 0; background: #12202A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; animation: phring .5s ease-in-out infinite alternate; }
@keyframes phring { to { background: #1B3342; } }
.pc-name { font-size: 28px; font-weight: 700; } .pc-sub { opacity: .9; line-height: 1.5; }
.ph-homebtn { align-self: center; width: 90px; height: 5px; border-radius: 3px; border: 0; background: rgba(255, 255, 255, .5); margin: 8px 0; flex: none; }
.ph-hand { position: absolute; bottom: -24px; width: 62px; height: 130px; background: #E0AC84; border-radius: 34px; z-index: 30; pointer-events: none; transform-style: flat; }
.ph-hand.l { left: -26px; transform: rotate(14deg); } .ph-hand.r { right: -26px; transform: rotate(-14deg); }
.ph-warn { position: absolute; left: 50%; top: -34px; transform: translateX(-50%); white-space: nowrap; background: #FFF4CC; color: #3A2A00; font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px; box-shadow: var(--shadow); }
.ph-close { position: absolute; right: -46px; top: 10px; width: 38px; height: 38px; min-height: 0; padding: 0; border-radius: 50%; font-size: 16px; line-height: 1; box-shadow: var(--shadow); }
.interact.alt { background: #FFF4CC; color: #3A2A00; border: 2px solid #F2B200; }
.sbook { width: min(430px, 94vw); }
#invSheet, #upSheet { z-index: 22; }
.up-card { text-align: center; padding: 18px 10px; background: #FFF8E7; border: 2px solid #E0C58A; border-radius: 14px; font-size: 20px; font-weight: 700; margin: 6px 0 10px; } .up-card small { display: block; font-weight: 400; font-size: 13px; color: #6B5B2E; margin-top: 4px; }
.up-bar { height: 8px; background: #E4ECEA; border-radius: 6px; overflow: hidden; margin-bottom: 8px; } .up-bar > i { display: block; height: 100%; background: #0F766E; }
.up-baskets { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; } .up-baskets .btn { min-height: 54px; border-left: 8px solid var(--c, #888); }
.up-shake { animation: upshake .3s; } @keyframes upshake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.up-cart { background: #D9E2E0; border: 3px solid #8FA0A3; border-radius: 12px; padding: 8px; margin-bottom: 10px; } .up-row { display: flex; gap: 6px; flex-wrap: wrap; min-height: 44px; padding: 6px; border-bottom: 4px solid #8FA0A3; } .up-row:last-child { border-bottom: 0; }
.up-slot { padding: 6px 10px; background: #fff; border: 2px solid #5E8F86; border-radius: 8px; font-size: 13px; animation: uppop .25s; } @keyframes uppop { from { transform: translateY(-30px) scale(1.2); opacity: .3; } to { transform: none; opacity: 1; } }
.up-chips { display: flex; gap: 8px; flex-wrap: wrap; } .up-chips .btn { text-align: left; }
.inv-tabs { display: flex; gap: 6px; padding: 0 14px 8px; flex-wrap: wrap; } .inv-tabs .btn.on { background: var(--accent, #0F766E); color: #fff; }
.inv-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; } .inv-bar input, .inv-bar select { padding: 8px 10px; border: 1px solid #9AA5A8; border-radius: 10px; font-size: 14px; }
.inv-tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; } .inv-tbl th { text-align: left; background: #E4ECEA; padding: 5px 6px; position: sticky; top: 0; } .inv-tbl td { padding: 5px 6px; border-bottom: 1px solid #DDE5E3; vertical-align: middle; }
.inv-tbl .n { text-align: right; white-space: nowrap; } .inv-out { color: #B91C1C; font-weight: 700; } .inv-low { color: #B45309; font-weight: 700; } .inv-q { display: inline-flex; gap: 4px; align-items: center; } .inv-q button { min-width: 34px; padding: 5px 7px; }
.inv-note { font-size: 12.5px; color: var(--muted); margin: 6px 0; } .inv-hint { padding: 8px 10px; background: #FFF4CC; border-radius: 10px; font-size: 13px; margin-bottom: 8px; }
#sigPad { position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.55); pointer-events: auto; } #sigPad[hidden] { display: none; }
.sp-box { width: min(560px, 94vw); background: #FBFAF4; color: #1B2A30; border-radius: 14px; padding: 12px 14px 14px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.sp-box h3 { margin: 0 0 4px; font-size: 16px; } .sp-box .sp-sub { font-size: 12.5px; color: #5B6B70; margin-bottom: 8px; }
#spCv { width: 100%; height: auto; aspect-ratio: 3 / 1.15; background: #fff repeating-linear-gradient(transparent 0 38px, #E6ECEC 38px 39px); border: 2px dashed #9AA5A8; border-radius: 8px; touch-action: none; cursor: crosshair; display: block; }
.sp-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; } .sp-msg { min-height: 16px; font-size: 12.5px; color: #C2410C; margin-top: 4px; }
.signm svg { display: block; overflow: visible; }
.sb-board { background: #8A6A3A; border-radius: 18px 18px 0 0; padding: 22px 12px 0; position: relative; transform: perspective(900px) rotateX(8deg); transform-origin: 50% 100%; box-shadow: 0 -6px 30px rgba(0, 0, 0, .4); }
.sb-clip { position: absolute; top: 4px; left: 50%; width: 70px; height: 22px; margin-left: -35px; background: #B0B7BA; border-radius: 6px; }
.sb-paper { position: relative; background: #FFFEF8; color: #26323A; border-radius: 6px 6px 0 0; padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.sb-title { font-weight: 700; font-size: 18px; text-align: center; } .sb-sub { font-size: 12px; color: #6B7A80; text-align: center; }
.sb-scroll { max-height: min(300px, 40vh); overflow-y: auto; border: 1px solid #9AA5A8; border-radius: 4px; }
.sb-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.sb-tbl th { position: sticky; top: 0; background: #E4ECEA; border: 1px solid #9AA5A8; padding: 4px; z-index: 1; }
.sb-tbl td { border: 1px solid #C5CED0; padding: 0 6px; height: 36px; }
.sb-tbl td.d { text-align: center; width: 48px; font-weight: 700; } .sb-tbl td.z { font-size: 12px; }
.sb-tbl tr.today td { background: #FFF4CC; } .sb-tbl tr.future td.z, .sb-tbl tr.future td.d { color: #6B7A80; }
.sb-tbl .miss { color: #C2410C; font-size: 12px; }
.sigw { position: relative; min-width: 80px; height: 30px; margin: 0 auto; text-align: center; } .signm { display: inline-block; font-family: 'LXGW WenKai TC','Kaiti TC','KaiTi','DFKai-SB','BiauKai',serif; font-size: 28px; line-height: 30px; color: #1A3A8F; white-space: nowrap; clip-path: inset(-10% 0 -10% 0); } .sgc { display: inline-block; font-style: normal; letter-spacing: 1px; } .signm.anim { clip-path: inset(-10% 100% -10% 0); }
.sigw .pen { position: absolute; left: 0; top: 0; font-size: 18px; margin: -16px 0 0 -2px; pointer-events: none; }
.sb-msg { min-height: 18px; font-size: 13px; color: #C2410C; text-align: center; }
.bd { font-style: normal; position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; border-radius: 9px; background: #E5534B; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
.ph-app span, #btnPhone { position: relative; }
#btnPhone.ring { animation: phshake .45s infinite; border-color: #E5534B; background: #FFE5E2; }
@keyframes phshake { 0%, 100% { transform: translateX(0) rotate(0); } 25% { transform: translateX(-3px) rotate(-8deg); } 75% { transform: translateX(3px) rotate(8deg); } }
.ph-msgs { position: absolute; inset: 0; background: #F2F5F6; color: #1B2A30; display: flex; flex-direction: column; padding-top: 24px; z-index: 3; }
.pm-head { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 1px solid #D5DDDF; }
.sh-bal { margin-left: auto; font-size: 12px; font-weight: 800; color: #0B7A82; }
.sh-tabs { display: flex; gap: 4px; padding: 6px 8px 0; border-bottom: 1px solid #D5DDDF; } .sh-tabs button { flex: 1; border: 0; background: transparent; padding: 6px 2px; font-size: 12px; color: #6a8a90; border-bottom: 3px solid transparent; font-weight: 700; } .sh-tabs button.on { color: #0B7A82; border-bottom-color: #0B7A82; }
.sh-card { background: #fff; border-radius: 12px; padding: 8px 10px; display: flex; gap: 10px; align-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); } .sh-card .em { font-size: 30px; width: 44px; text-align: center; flex: none; } .sh-card .em svg { width: 44px; height: 44px; display: block; } .sh-card .tx { flex: 1; min-width: 0; } .sh-card .nm { font-weight: 800; font-size: 13px; } .sh-card .ds { font-size: 11px; color: #6a8a90; line-height: 1.35; margin: 1px 0; } .sh-card .pr { font-weight: 800; color: #D9534F; font-size: 13px; }
.sh-card .btn { padding: 6px 8px; font-size: 12px; flex: none; } .sh-qty { display: flex; align-items: center; gap: 6px; flex: none; } .sh-qty button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #C5D0D2; background: #fff; font-size: 15px; line-height: 1; } .sh-qty b { min-width: 16px; text-align: center; font-size: 13px; }
.sh-sum { background: #fff; border-radius: 12px; padding: 10px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; } .sh-sum .row { display: flex; justify-content: space-between; } .sh-sum .btn { width: 100%; } .sh-empty { text-align: center; color: #6a8a90; font-size: 13px; padding: 28px 8px; } .sh-st { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 8px; background: #FFF1CC; color: #8a6200; } .sh-st.ok { background: #D8F3E6; color: #1b7a4b; }

/* title */
#title { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: var(--bg); background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow-y: auto; padding-top: 16px; padding-bottom: 16px; }
.title-card { width: min(460px, 100%); background: var(--panel); border-radius: 22px; padding: 28px 24px 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; margin: auto; }

.title-card p { margin: 0; color: var(--muted); }

const invStock = (p, picks) => invStockK(invKey(p, picks), p);
function invAdd(p, picks, n) { const k = invKey(p, picks), cur = invStockK(k, p); SAVE.inv.stock[k] = Math.max(0, cur + n); }
const hrand = (str) => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15; return (h >>> 0) / 4294967296; };

const whAdded = (key) => (db.wh && db.wh[key]) || 0;   // stock the owner added to the company warehouse by hand (part of the published shop data, so every player gets it)
function whQty(p, key, week) {
  const avail = p.avail != null && p.avail !== '' ? Math.max(0, Math.min(100, +p.avail)) / 100 : 0.93;
  let base = 0;
  if (hrand(p.id + '#b' + week) < avail) {   // otherwise the company simply has none of this item this week
    const cap = p.supply != null && p.supply !== '' ? Math.max(0, +p.supply) : Math.max(4, Math.round(invDemand(p) * 2.5));
    base = cap <= 0 ? 0 : Math.max(1, Math.round(cap * (0.3 + 0.7 * hrand(key + '#a' + week))));
  }
  return base + whAdded(key);
}
function salesIn(key, days, curDay) {   // units sold in the last `days` days, today included
  const I = SAVE.inv; let n = I.today[key] || 0;

}

function groupsLacking(phoneId) {
  const map = new Map();

  const out = [];
  map.forEach((items, k) => { if (items.some((x) => x.phone !== 'all') && !items.some((x) => x.phone === phoneId)) out.push({ key: k, items: items }); });
  return out;
}

function cleanImport(obj, allowEmpty) {
  if (!obj || !Array.isArray(obj.phones) || !Array.isArray(obj.products)) throw new Error('格式不對,需要包含手機型號與商品。');
  const phones = [];
  obj.phones.forEach((p) => { if (p && typeof p.name === 'string' && p.name.trim()) phones.push({ id: String(p.id || ('m' + Math.random().toString(36).slice(2, 8))), name: p.name.trim().slice(0, 24) }); });
  const ids = new Set(phones.map((p) => p.id));
  const products = [];
  obj.products.forEach((p, i) => {
    if (!p || typeof p.name !== 'string' || !p.name.trim() || !catById[p.cat]) return;
    const price = Math.round(Number(p.price));
    if (!isFinite(price) || price < 0) return;
    products.push(Object.assign({ id: String(p.id || ('i' + Date.now().toString(36) + i)), cat: p.cat, name: p.name.trim().slice(0, 40), brand: String(p.brand || '').slice(0, 20), price: Math.min(price, 99999), phone: (p.phone === 'all' || ids.has(p.phone)) ? p.phone : 'all', house: p.house === true, options: normOptions(Array.isArray(p.options) ? p.options : optsFromLegacy(p)), rules: Array.isArray(p.rules) ? parseRules(p.rules.join('\n')) : [], note: '' }, supplyOf(p)));
  });
  if (!products.length && !allowEmpty) throw new Error('沒有找到可用的商品。');
  const wh = {}; if (obj.wh && typeof obj.wh === 'object') Object.keys(obj.wh).slice(0, 3000).forEach((k) => { const n = Math.max(0, Math.min(999, Math.floor(+obj.wh[k] || 0))); if (n && k.length <= 80) wh[k] = n; });
  return { phones: phones, products: products, wh: wh };
}

  else if (act === 'delsel') {
    if (!adm.sel.size) return;
    if (adm.confirm === 'bulk') { const n = adm.sel.size; db.products = db.products.filter((x) => !adm.sel.has(x.id)); afterChange(); toast('已刪除 ' + n + ' 項商品'); }

  }

    db.phones = db.phones.filter((p) => p.id !== b.dataset.id); afterChange(); toast('已刪除'); renderAdmin();
  }
  else if (act === 'phadd') { adm.phAdd = adm.phAdd === b.dataset.id ? '' : b.dataset.id; adm.phSel.clear(); adm.msg = ''; renderAdmin(); }
  else if (act === 'phgpick') { if (b.checked) adm.phSel.add(b.dataset.k); else adm.phSel.delete(b.dataset.k); renderAdmin(); }
  else if (act === 'phgall') {
    const gs = groupsLacking(b.dataset.id);
    if (gs.every((g) => adm.phSel.has(g.key))) adm.phSel.clear(); else gs.forEach((g) => adm.phSel.add(g.key));

    const pid = b.dataset.id, gs = groupsLacking(pid).filter((g) => adm.phSel.has(g.key));

    afterChange(); adm.phSel.clear(); toast('已為 ' + phoneName(pid) + ' 新增 ' + gs.length + ' 項商品'); renderAdmin();

  }
  else if (act === 'addphall' || act === 'addphnone') {
    document.querySelectorAll('input[name="f_addph"]').forEach((x) => { x.checked = act === 'addphall' && x.value !== 'all'; });

    try { navigator.clipboard.writeText(ta.value).then(() => toast('已複製'), fallback); } catch (err) { fallback(); }

$('#adminBody').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = adm.editing;
  if (!f) return;
  const name = $('#f_name').value.trim();
  const brand = $('#f_brand').value.trim();
  const priceRaw = $('#f_price').value.trim();
  const price = Number(priceRaw);
  const checkedPhones = () => Array.from(document.querySelectorAll('input[name="f_ph"]:checked')).map((x) => x.value);
  const err = (m) => { captureForm(); adm.msg = m; renderAdmin(); };
  const fOpts = normOptions(readOpts().map((o) => ({ n: o.n, v: o.vt })));
  const fRules = $('#f_rules') ? parseRules($('#f_rules').value) : parseRules(f.rulesText);
  if (!name) return err('請輸入商品名稱。');
  if (priceRaw === '' || !isFinite(price) || price < 0 || price > 99999 || Math.floor(price) !== price) return err('價格要是 0 到 99999 的整數。');
  const sup = supplyOf(f.id ? db.products.find((x) => x.id === f.id) : null);   // HQ supply settings are edited in the 總公司管理 tab; keep them as they are
  const mkId = () => 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  if (f.id) {
    const rec = { id: f.id, cat: $('#f_cat').value, name: name, brand: brand || '無品牌', price: price, phone: $('#f_phone').value, house: $('#f_house').checked, options: cloneOpts(fOpts), rules: fRules.slice(), note: '' };
    Object.assign(rec, sup);
    const i = db.products.findIndex((x) => x.id === rec.id);
    let n = 1;
    if (i >= 0 && $('#f_all') && $('#f_all').checked) {
      const sibs = sibsOf(db.products[i]);
      sibs.forEach((x) => { if (x.id !== rec.id) { x.cat = rec.cat; x.name = rec.name; x.brand = rec.brand; x.price = rec.price; x.house = rec.house; x.options = cloneOpts(rec.options); x.rules = rec.rules.slice(); } });
      n = sibs.length;
    }
    if (i >= 0) db.products[i] = rec; else db.products.push(rec);
    const addPh = Array.from(document.querySelectorAll('input[name="f_addph"]:checked')).map((x) => x.value);
    addPh.forEach((ph) => db.products.push(Object.assign({ id: mkId(), cat: rec.cat, name: rec.name, brand: rec.brand, price: rec.price, phone: ph, house: rec.house, options: cloneOpts(rec.options), rules: rec.rules.slice(), note: '' }, sup)));
    if (addPh.length) { afterChange(); adm.editing = null; toast('已儲存,並新增 ' + addPh.length + ' 個型號'); renderAdmin(); return; }
    afterChange(); adm.editing = null; toast(n > 1 ? '已更新同款全部 ' + n + ' 項' : '已儲存修改'); renderAdmin();
    return;
  }
  const phs = checkedPhones();
  if (!phs.length) return err('請至少勾選一個適用手機(或「通用」)。');
  phs.forEach((ph) => db.products.push(Object.assign({ id: mkId(), cat: $('#f_cat').value, name: name, brand: brand || '無品牌', price: price, phone: ph, house: $('#f_house').checked, options: cloneOpts(fOpts), rules: fRules.slice(), note: '' }, sup)));
  afterChange(); adm.editing = null; toast(phs.length > 1 ? '已新增 ' + phs.length + ' 項商品' : '已新增商品'); renderAdmin();
});

async function detectOwner() {
